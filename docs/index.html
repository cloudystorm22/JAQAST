<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JAQAST — Pantauan &amp; Prediksi Kualitas Udara Jakarta &amp; Tangerang</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0B0F14;
    --panel: rgba(18,24,31,0.8);
    --panel-solid: #12181F;
    --border: rgba(255,255,255,0.08);
    --text: #E7ECF2;
    --text-muted: #8B98A5;
    --accent: #6FA8FF;
    --map-bg: #0B0F14;

    --c-baik: #4CAF7D;
    --c-sedang: #F4D35E;
    --c-tidak-sehat: #F2994A;
    --c-sangat-tidak-sehat: #EB5757;
    --c-berbahaya: #7A1F3D;
    --c-nodata: #3A4552;
  }
  html.light{
    --bg: #F1F3F5;
    --panel: rgba(255,255,255,0.85);
    --panel-solid: #FFFFFF;
    --border: rgba(15,23,31,0.10);
    --text: #131A21;
    --text-muted: #5B6672;
    --accent: #2E6BD6;
    --map-bg: #E7EAED;
    --c-nodata: #C7CDD3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
    font-family:'IBM Plex Mono', monospace; transition:background .2s ease, color .2s ease;}
  #map{position:absolute; inset:0; background:var(--map-bg);}
  .leaflet-container{background:var(--map-bg);}

  .hud{position:absolute; z-index:1000; pointer-events:none;}
  .hud > *{pointer-events:auto;}

  /* ---------- Header ---------- */
  .header{top:18px; left:18px; right:18px; display:flex; justify-content:space-between; align-items:flex-start; gap:12px;}
  .brand{
    background:var(--panel); backdrop-filter:blur(10px);
    border:1px solid var(--border); border-radius:10px;
    padding:14px 18px; max-width:440px;
  }
  .brand-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .brand h1{
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:20px; letter-spacing:0.02em;
    margin:0; color:var(--text);
  }
  .brand h1 .dot{color:var(--c-sedang);}
  .brand p{margin:6px 0 0 0; font-size:12px; line-height:1.5; color:var(--text-muted);}

  .theme-toggle{
    flex:none; width:34px; height:34px; border-radius:8px;
    background:transparent; border:1px solid var(--border);
    color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center;
    font-size:15px; transition:background .15s ease;
  }
  .theme-toggle:hover{background:rgba(128,128,128,0.15);}

  /* ---------- Legend / gauge ---------- */
  .gauge{
    background:var(--panel); backdrop-filter:blur(10px);
    border:1px solid var(--border); border-radius:10px;
    padding:14px 16px; min-width:200px;
  }
  .gauge h2{
    font-family:'Space Grotesk', sans-serif; font-size:11px; text-transform:uppercase; letter-spacing:0.12em;
    color:var(--text-muted); margin:0 0 10px 0; font-weight:600;
  }
  .gauge-row{display:flex; align-items:center; gap:8px; font-size:12px; padding:3px 0; color:var(--text);}
  .gauge-row .sw{width:12px; height:12px; border-radius:3px; flex:none;}
  .gauge-row .rng{color:var(--text-muted); font-size:10.5px; margin-left:auto;}

  /* ---------- Date picker (bottom-center) ---------- */
  .datebar{
    bottom:18px; left:50%; transform:translateX(-50%);
    background:var(--panel); backdrop-filter:blur(10px);
    border:1px solid var(--border); border-radius:12px;
    padding:6px; display:flex; gap:4px;
  }
  .datebar button{
    font-family:'IBM Plex Mono', monospace; font-size:11.5px; font-weight:500;
    background:transparent; border:none; color:var(--text-muted);
    padding:8px 12px; border-radius:8px; cursor:pointer; white-space:nowrap;
    transition:background .15s ease, color .15s ease;
  }
  .datebar button:hover{background:rgba(128,128,128,0.15); color:var(--text);}
  .datebar button.active{background:var(--accent); color:#fff;}

  /* ---------- Footer status ---------- */
  .footer{
    bottom:18px; left:18px;
    background:var(--panel); backdrop-filter:blur(10px);
    border:1px solid var(--border); border-radius:10px;
    padding:10px 14px; font-size:11px; color:var(--text-muted);
    display:flex; align-items:center; gap:8px;
  }
  .footer .pulse{
    width:7px; height:7px; border-radius:50%; background:var(--c-baik);
    box-shadow:0 0 0 0 rgba(76,175,125,0.6); animation:pulse 2.2s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(76,175,125,0.5);}
    70%{box-shadow:0 0 0 8px rgba(76,175,125,0);}
    100%{box-shadow:0 0 0 0 rgba(76,175,125,0);}
  }

  /* ---------- Popup readout ---------- */
  .leaflet-popup-content-wrapper{background:var(--panel-solid); color:var(--text); border:1px solid var(--border); border-radius:10px;}
  .leaflet-popup-tip{background:var(--panel-solid);}
  .leaflet-popup-content{margin:14px 16px; font-family:'IBM Plex Mono', monospace;}
  .readout-title{font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:15px; margin-bottom:2px;}
  .readout-badge{
    display:inline-block; font-size:10.5px; font-weight:600; letter-spacing:0.04em;
    padding:2px 8px; border-radius:20px; margin:6px 0 10px 0; text-transform:uppercase;
  }
  .readout-big{font-family:'Space Grotesk', sans-serif; font-size:34px; font-weight:700; line-height:1;}
  .readout-big-label{font-size:10px; color:var(--text-muted); letter-spacing:0.08em; text-transform:uppercase;}
  .readout-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:6px 14px;
    margin-top:12px; padding-top:10px; border-top:1px solid var(--border); font-size:11.5px;
  }
  .readout-grid div span{color:var(--text-muted); display:block; font-size:9.5px; text-transform:uppercase; letter-spacing:0.06em;}
  .readout-empty{font-size:12px; color:var(--text-muted); margin-top:8px;}

  @media (max-width: 640px){
    .header{flex-direction:column;}
    .brand{max-width:none; width:100%;}
    .gauge{min-width:0;}
    .datebar{max-width:calc(100vw - 36px); overflow-x:auto;}
    .footer{max-width:calc(100vw - 36px);}
  }
</style>
</head>
<body>

<div id="map"></div>

<div class="hud header">
  <div class="brand">
    <div class="brand-row">
      <h1>JAQAST<span class="dot">·</span></h1>
      <button class="theme-toggle" id="theme-toggle" title="Ganti tema" aria-label="Ganti tema terang/gelap">🌙</button>
    </div>
    <p>Pantauan dan prediksi kualitas udara harian — Jakarta &amp; Kota Tangerang.</p>
  </div>
  <div class="gauge" id="gauge">
    <h2>Skala ISPU</h2>
    <div class="gauge-row"><span class="sw" style="background:var(--c-baik)"></span>Baik<span class="rng">0–50</span></div>
    <div class="gauge-row"><span class="sw" style="background:var(--c-sedang)"></span>Sedang<span class="rng">50–100</span></div>
    <div class="gauge-row"><span class="sw" style="background:var(--c-tidak-sehat)"></span>Tidak Sehat<span class="rng">100–200</span></div>
    <div class="gauge-row"><span class="sw" style="background:var(--c-sangat-tidak-sehat)"></span>Sangat Tidak Sehat<span class="rng">200–300</span></div>
    <div class="gauge-row"><span class="sw" style="background:var(--c-berbahaya)"></span>Berbahaya<span class="rng">300+</span></div>
    <div class="gauge-row"><span class="sw" style="background:var(--c-nodata)"></span>Tanpa data<span class="rng">—</span></div>
  </div>
</div>

<div class="hud datebar" id="datebar"></div>

<div class="hud footer" id="footer">
  <span class="pulse"></span>
  <span id="footer-text">Memuat data...</span>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const CATEGORY_COLOR = {
    "Baik": "#4CAF7D",
    "Sedang": "#F4D35E",
    "Tidak Sehat": "#F2994A",
    "Sangat Tidak Sehat": "#EB5757",
    "Berbahaya": "#7A1F3D",
  };
  const NODATA_COLOR_DARK = "#3A4552";
  const NODATA_COLOR_LIGHT = "#C7CDD3";

  // ---------------- Tema terang / gelap ----------------
  const root = document.documentElement;
  const themeBtn = document.getElementById('theme-toggle');

  function applyTheme(mode) {
    if (mode === 'light') {
      root.classList.add('light');
      themeBtn.textContent = '☀️';
    } else {
      root.classList.remove('light');
      themeBtn.textContent = '🌙';
    }
    localStorage.setItem('jaqast-theme', mode);
    updateBasemap(mode);
  }

  const savedTheme = localStorage.getItem('jaqast-theme')
    || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');

  themeBtn.addEventListener('click', () => {
    const next = root.classList.contains('light') ? 'dark' : 'light';
    applyTheme(next);
  });

  // ---------------- Peta ----------------
  const map = L.map('map', { zoomControl: false, attributionControl: true }).setView([-6.18, 106.75], 11);
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  let baseLayer = null;
  let labelLayer = null;

  function updateBasemap(mode) {
    if (baseLayer) map.removeLayer(baseLayer);
    if (labelLayer) map.removeLayer(labelLayer);
    if (mode === 'light') {
      baseLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CARTO', subdomains: 'abcd', maxZoom: 19,
      }).addTo(map);
      labelLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', {
        subdomains: 'abcd', maxZoom: 19, opacity: 0.8,
      }).addTo(map);
    } else {
      baseLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CARTO', subdomains: 'abcd', maxZoom: 19,
      }).addTo(map);
      labelLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png', {
        subdomains: 'abcd', maxZoom: 19, opacity: 0.6,
      }).addTo(map);
    }
    if (geoLayer) restyleAll();
  }

  function fmt(v, digits = 0) {
    if (v === null || v === undefined || Number.isNaN(v)) return "—";
    return Number(v).toFixed(digits);
  }

  function nodataColor() {
    return root.classList.contains('light') ? NODATA_COLOR_LIGHT : NODATA_COLOR_DARK;
  }

  // ---------------- Data + date picker ----------------
  let geoLayer = null;
  let selectedDate = null;
  let availableDates = [];

  function seriesForDate(feature, date) {
    const series = feature.properties.series || [];
    return series.find(s => s.date_wib === date) || null;
  }

  function styleForEntry(entry) {
    const color = entry ? (CATEGORY_COLOR[entry.ispu_kategori] || nodataColor()) : nodataColor();
    return { fillColor: color, fillOpacity: entry ? 0.55 : 0.25, color: color, weight: 1, opacity: 0.9 };
  }

  function popupHTML(feature, entry) {
    const name = feature.properties.wilayah || "-";
    if (!entry) {
      return `<div class="readout-title">${name}</div><div class="readout-empty">Tidak ada data untuk tanggal ini.</div>`;
    }
    const kategori = entry.ispu_kategori || "Tanpa data";
    const color = CATEGORY_COLOR[kategori] || nodataColor();
    return `
      <div class="readout-title">${name}</div>
      <span class="readout-badge" style="background:${color}22; color:${color}; border:1px solid ${color}66;">${kategori}</span>
      <div class="readout-big">${fmt(entry.ispu_total)}<span style="font-size:14px; color:var(--text-muted); font-weight:500;"> ISPU</span></div>
      <div class="readout-big-label">indeks standar pencemar udara &middot; ${entry.date_wib || "-"}</div>
      <div class="readout-grid">
        <div><span>PM10</span>${fmt(entry.ispu_pm10)}</div>
        <div><span>SO2</span>${fmt(entry.ispu_so2)}</div>
        <div><span>CO</span>${fmt(entry.ispu_co)}</div>
        <div><span>O3</span>${fmt(entry.ispu_o3)}</div>
        <div><span>NO2</span>${fmt(entry.ispu_no2)}</div>
        <div><span>Suhu rata²</span>${fmt(entry.tt_air_avg, 1)}&deg;C</div>
      </div>
    `;
  }

  function restyleAll() {
    if (!geoLayer) return;
    geoLayer.eachLayer(layer => {
      const entry = seriesForDate(layer.feature, selectedDate);
      layer.setStyle(styleForEntry(entry));
      if (layer.getPopup()) layer.setPopupContent(popupHTML(layer.feature, entry));
    });
  }

  function dateLabel(iso) {
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('id-ID', { weekday: 'short', day: '2-digit', month: 'short' });
  }

  function buildDatebar() {
    const bar = document.getElementById('datebar');
    bar.innerHTML = '';
    availableDates.forEach(dateStr => {
      const btn = document.createElement('button');
      btn.textContent = dateLabel(dateStr);
      btn.className = dateStr === selectedDate ? 'active' : '';
      btn.addEventListener('click', () => {
        selectedDate = dateStr;
        [...bar.children].forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        restyleAll();
      });
      bar.appendChild(btn);
    });
  }

  function loadGeoJSON() {
    fetch('./data/latest.geojson?t=' + Date.now())
      .then(r => { if (!r.ok) throw new Error('fetch geojson gagal'); return r.json(); })
      .then(geojson => {
        const dateSet = new Set();
        geojson.features.forEach(f => (f.properties.series || []).forEach(s => dateSet.add(s.date_wib)));
        availableDates = [...dateSet].sort();
        selectedDate = availableDates[0] || null;
        buildDatebar();

        geoLayer = L.geoJSON(geojson, {
          style: feature => styleForEntry(seriesForDate(feature, selectedDate)),
          onEachFeature: (feature, layer) => {
            layer.bindPopup(popupHTML(feature, seriesForDate(feature, selectedDate)));
            layer.on('mouseover', () => layer.setStyle({ fillOpacity: 0.85, weight: 2 }));
            layer.on('mouseout', () => restyleAll());
          },
        }).addTo(map);
      })
      .catch(err => {
        document.getElementById('footer-text').textContent = 'Gagal memuat data — coba lagi nanti.';
        console.error(err);
      });
  }

  function loadMeta() {
    fetch('./data/latest.json?t=' + Date.now())
      .then(r => { if (!r.ok) throw new Error('fetch meta gagal'); return r.json(); })
      .then(meta => {
        if (!meta.generated_at_wib) {
          document.getElementById('footer-text').textContent = 'Belum ada data — pipeline belum pernah jalan.';
          return;
        }
        const dt = new Date(meta.generated_at_wib);
        const dtStr = dt.toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short', timeZone: 'Asia/Jakarta' });
        document.getElementById('footer-text').textContent = `Update terakhir: ${dtStr} WIB`;
      })
      .catch(() => {
        document.getElementById('footer-text').textContent = 'Status pembaruan tidak tersedia.';
      });
  }

  applyTheme(savedTheme);
  loadGeoJSON();
  loadMeta();
</script>
</body>
</html>
