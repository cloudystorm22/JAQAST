name: Update data JAQAST harian

on:
  schedule:
    # 23:30 UTC = 06:30 WIB setiap hari. Sesuaikan jika perlu.
    - cron: "30 23 * * *"
  workflow_dispatch: {}   # tombol "Run workflow" manual di tab Actions, untuk testing

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies sistem (geopandas)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin

      - name: Install dependencies Python
        run: pip install -r pipeline/requirements.txt

      - name: Jalankan pipeline
        env:
          ADS_URL: ${{ secrets.ADS_URL }}
          ADS_KEY: ${{ secrets.ADS_KEY }}
          RUN_MODE: "yesterday"
        run: python pipeline/run_pipeline.py

      - name: Commit & push hasil terbaru
        run: |
          git config user.name "jaqast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/latest.geojson docs/data/latest.json data/history.csv
          git diff --cached --quiet || git commit -m "auto: update data JAQAST $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
